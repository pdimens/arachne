name: Test

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "docs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

env:
  TTY_COMPATIBLE: 1

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true
          activate-environment: false
      - name: Build arachne
        run: pixi run build
      - name: Create test data
        run: test/data.py
      - name: Index reference
        run: bin/arachne index test/hap1.fa
      - name: Align default
        run: bin/arachne align -t 4 -s TestSample test/hap1.fa test/test.R{1,2}.fq.gz
      - name: Align with -C comments
        run: bin/arachne align -t 4 -C -s TestSample test/hap1.fa test/test.R{1,2}.fq.gz
