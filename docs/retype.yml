start:
  pro: true
nav:
  mode: stack
input: .
output: .retype
url: pdimens.github.io/arachne/
meta:
  title: " | Arachne"
footer:
  copyright: "&copy; Copyright {{ year }}. All rights reserved."
showSidebarFilter: false
theme:
  base:
    base-link-weight: 500
    nav-item-text-active-weight: 700
    image-rounded: 0.75rem
    nav-item-text-stack: "#1e66f5"
branding:
  label: 0.1
  logo: static/logo.png
  logoDark: static/logo_dark.png
  logoAlign: left
favicon: static/favicon.png
search:
  mode: partial
edit:
  repo: "https://github.com/pdimens/arachne/edit"
  base: /
  branch: "docs"
links:
  - text: Therkildsen Lab
    link: https://www.therkildsenlab.org/
    icon: https://www.therkildsenlab.org/uploads/1/4/5/5/145548022/published/new-logo-smaller.png
    target: blank
  - text: Cornell GIH
    link: https://www.genomicsinnovation.cornell.edu/
    icon: https://raw.githubusercontent.com/pdimens/harpy/refs/heads/main/docs/static/biotech.png
    target: blank
  - text: LASTQ Standard
    link: https://pdimens.github.io/lastq/
    icon: https://pdimens.github.io/lastq/img/logo.png
    target: blank
  - text: Source
    link: https://github.com/pdimens/arachne
    icon: mark-github
    target: blank
  - text: Submit Issue
    link: https://github.com/pdimens/arachne/issues/new/
    icon: bug
    target: blank
exclude:
  - "aligner/"
  - "cmd/"
  - "fastqreader"
  - "fqsort"
  - "gobwa/"
  - "jemalloc/"
  - "optimizer/"
  - "preprocess/"
  - "test/"
  - "README.md"
